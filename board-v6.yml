name: Build KenzO board v6
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          set -eo pipefail
          mkdir -p kb
          cd kb
          mkdir -p .
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KenzoBoard"
          include ':app'
          EOF_0
          mkdir -p .
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_1
          mkdir -p .
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF_2
          mkdir -p app
          cat > app/build.gradle <<'EOF_3'
          plugins {
              id 'com.android.application' version '8.5.2'
          }

          android {
              namespace 'com.kenzo.board'
              compileSdk 34

              defaultConfig {
                  applicationId "com.kenzo.board"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
                  encoding 'UTF-8'
              }
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="KenzO board"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BoardService"
                      android:exported="true"
                      android:icon="@mipmap/ic_launcher"
                      android:label="KenzO board"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/method.xml <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.kenzo.board.MainActivity" />
          EOF_5
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">KenzO board</string>
          </resources>
          EOF_6
          mkdir -p app/src/main/java/com/kenzo/board
          cat > app/src/main/java/com/kenzo/board/MainActivity.java <<'EOF_7'
          package com.kenzo.board;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  int pad = dp(20);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(pad, pad, pad, pad);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  TextView title = new TextView(this);
                  title.setText("KenzO board");
                  title.setTextSize(28);
                  title.setTextColor(Color.BLACK);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText("\u0643\u0644 \u0627\u0644\u0625\u0639\u062f\u0627\u062f\u0627\u062a \u062f\u0627\u062e\u0644 \u0627\u0644\u0643\u064a\u0628\u0648\u0631\u062f \u0646\u0641\u0633\u0647: \u062f\u0648\u0633 \u0639\u0644\u0649 \u0639\u0644\u0627\u0645\u0629 \u2699 \u0627\u0644\u0644\u064a \u0628\u0627\u0644\u0635\u0641 \u0627\u0644\u0623\u0633\u0641\u0644.");
                  info.setTextSize(16);
                  info.setPadding(0, dp(12), 0, dp(16));
                  root.addView(info);

                  Button enable = new Button(this);
                  enable.setText("1) \u062a\u0641\u0639\u064a\u0644 \u0627\u0644\u0643\u064a\u0628\u0648\u0631\u062f");
                  enable.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          startActivity(new Intent(Settings.ACTION_INPUT_METHOD_SETTINGS));
                      }
                  });
                  root.addView(enable);

                  Button pick = new Button(this);
                  pick.setText("2) \u0627\u062e\u062a\u064a\u0627\u0631 \u0627\u0644\u0643\u064a\u0628\u0648\u0631\u062f");
                  pick.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          InputMethodManager imm =
                                  (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                          if (imm != null) imm.showInputMethodPicker();
                      }
                  });
                  root.addView(pick);

                  EditText test = new EditText(this);
                  test.setHint("\u062c\u0631\u0651\u0628 \u0627\u0644\u0643\u062a\u0627\u0628\u0629 \u0647\u0646\u0627");
                  test.setPadding(0, dp(24), 0, dp(12));
                  root.addView(test);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }
          }
          EOF_7
          mkdir -p app/src/main/java/com/kenzo/board
          cat > app/src/main/java/com/kenzo/board/BoardService.java <<'EOF_8'
          package com.kenzo.board;

          import android.content.SharedPreferences;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.LayerDrawable;
          import android.inputmethodservice.InputMethodService;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.text.InputType;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.HapticFeedbackConstants;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputConnection;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class BoardService extends InputMethodService {

              static final String PREFS = "kenzoboard";
              static final String K_AUTO = "auto";
              static final String K_DIGITS = "digits";
              static final String K_SPLIT = "split";
              static final String K_HAPTIC = "haptic";
              static final String K_LANG = "lang";
              static final String K_AUTOL = "autol";
              static final String K_LETTERS = "letters";
              static final String K_AUTOP = "autop";
              static final String K_PAUSE = "pause";

              static final int MAX_DIGITS = 101;
              static final int MAX_LETTERS = 40;

              private static final int MATCH = ViewGroup.LayoutParams.MATCH_PARENT;

              private static final int C_BG = 0xFF0D0D0D;
              private static final int C_KEY = 0xFF1E1E20;
              private static final int C_SPECIAL = 0xFF2A2A2E;
              private static final int C_PRESSED = 0xFF3E3E44;
              private static final int C_LINE = 0xFF124A70;
              private static final int C_ON = 0xFF1E9E45;
              private static final int C_TEXT = 0xFFFFFFFF;
              private static final int C_DIM = 0xFF9A9AA0;

              private static final int PAGE_AR = 0;
              private static final int PAGE_AR2 = 1;
              private static final int PAGE_EN = 2;
              private static final int PAGE_NUM = 3;
              private static final int PAGE_SYM = 4;

              private static final int ROW_DP = 50;
              private static final int GRID_ROW_DP = 38;

              // \u0627\u0633\u0645 \u0623\u0643\u0628\u0631 \u0645\u0631\u062a\u0628\u0629 \u0644\u0647\u0630\u0627 \u0627\u0644\u0639\u062f\u062f \u0645\u0646 \u0627\u0644\u062e\u0627\u0646\u0627\u062a
              static final String[] NAMES = {
                      "\u0648\u062d\u062f\u0627\u062a", "\u0623\u0644\u0641", "\u0645\u0644\u064a\u0648\u0646", "\u0645\u0644\u064a\u0627\u0631", "\u062a\u0631\u0644\u064a\u0648\u0646", "\u0643\u0648\u0627\u062f\u0631\u064a\u0644\u064a\u0648\u0646",
                      "\u0643\u0648\u064a\u0646\u062a\u0644\u064a\u0648\u0646", "\u0633\u0643\u0633\u062a\u0644\u064a\u0648\u0646", "\u0633\u0628\u062a\u0644\u064a\u0648\u0646", "\u0623\u0648\u0643\u062a\u0644\u064a\u0648\u0646", "\u0646\u0648\u0646\u0644\u064a\u0648\u0646", "\u062f\u064a\u0633\u064a\u0644\u064a\u0648\u0646",
                      "\u0623\u0646\u062f\u064a\u0633\u064a\u0644\u064a\u0648\u0646", "\u062f\u0648\u062f\u064a\u0633\u064a\u0644\u064a\u0648\u0646", "\u062a\u0631\u064a\u062f\u064a\u0633\u064a\u0644\u064a\u0648\u0646", "\u0643\u0648\u0627\u062a\u0648\u0631\u062f\u0633\u064a\u0644\u064a\u0648\u0646", "\u0643\u0648\u064a\u0646\u062f\u064a\u0633\u064a\u0644\u064a\u0648\u0646", "\u0633\u0643\u0633\u062f\u064a\u0633\u064a\u0644\u064a\u0648\u0646",
                      "\u0633\u0628\u062a\u0646\u062f\u064a\u0633\u064a\u0644\u064a\u0648\u0646", "\u0623\u0648\u0643\u062a\u0648\u062f\u064a\u0633\u064a\u0644\u064a\u0648\u0646", "\u0646\u0648\u0641\u0645\u062f\u064a\u0633\u064a\u0644\u064a\u0648\u0646", "\u0641\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646", "\u0623\u0646\u0641\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646", "\u062f\u0648\u0641\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646",
                      "\u062a\u0631\u064a\u0641\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646", "\u0643\u0648\u0627\u062a\u0648\u0631\u0641\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646", "\u0643\u0648\u064a\u0646\u0641\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646", "\u0633\u0643\u0633\u0641\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646", "\u0633\u0628\u062a\u0646\u0641\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646", "\u0623\u0648\u0643\u062a\u0648\u0641\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646",
                      "\u0646\u0648\u0641\u0645\u0641\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646", "\u062a\u0631\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646", "\u0623\u0646\u062a\u0631\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646", "\u062f\u0648\u062a\u0631\u064a\u062c\u0646\u062a\u0644\u064a\u0648\u0646"
              };

              static String unitName(int digits) {
                  if (digits >= MAX_DIGITS) return "\u062c\u0648\u062c\u0644";
                  int g = (digits + 2) / 3;
                  if (g < 1) g = 1;
                  if (g > NAMES.length) g = NAMES.length;
                  return NAMES[g - 1];
              }

              private SharedPreferences prefs;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private LinearLayout root;
              private FrameLayout content;
              private TextView status;

              private boolean auto;
              private boolean autoLetters;
              private boolean autoPause;
              private int pauseMs = 500;
              private int letters = 5;
              private int lastKind;   // 0 \u0644\u0627 \u0634\u064a \u060c 1 \u0631\u0642\u0645 \u060c 2 \u062d\u0631\u0641
              private boolean split;
              private boolean haptic;
              private int digits = 10;
              private int lang;      // 0 \u0639\u0631\u0628\u064a \u060c 1 \u0625\u0646\u0643\u0644\u064a\u0632\u064a
              private int page = PAGE_AR;
              private int shift;     // \u0644\u0644\u0625\u0646\u0643\u0644\u064a\u0632\u064a: 0 \u0639\u0627\u062f\u064a \u060c 1 \u062d\u0631\u0641 \u0643\u0628\u064a\u0631 \u0645\u0631\u0629 \u0648\u062d\u062f\u0629 \u060c 2 \u0643\u0644\u0647\u0627 \u0643\u0628\u064a\u0631\u0629
              private boolean panelOpen;
              private int typed;
              private long lastShiftTap;

              private final Runnable sendRunnable = new Runnable() {
                  @Override
                  public void run() {
                      sendNow();
                  }
              };

              private final Runnable pauseRunnable = new Runnable() {
                  @Override
                  public void run() {
                      typed = 0;
                      lastKind = 0;
                      sendNow();
                      updateStatus();
                  }
              };

              private final Runnable renderRunnable = new Runnable() {
                  @Override
                  public void run() {
                      render();
                  }
              };

              private final Runnable repeatRunnable = new Runnable() {
                  @Override
                  public void run() {
                      deleteBack();
                      handler.postDelayed(this, 45);
                  }
              };

              // ------------------------------------------------------------ \u062f\u0648\u0631\u0629 \u0627\u0644\u062d\u064a\u0627\u0629

              @Override
              public void onCreate() {
                  super.onCreate();
                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                  auto = prefs.getBoolean(K_AUTO, true);
                  autoLetters = prefs.getBoolean(K_AUTOL, false);
                  letters = clampLetters(prefs.getInt(K_LETTERS, 5));
                  autoPause = false;
                  pauseMs = clampPause(prefs.getInt(K_PAUSE, 500));
                  split = prefs.getBoolean(K_SPLIT, false);
                  haptic = prefs.getBoolean(K_HAPTIC, false);
                  digits = clampDigits(prefs.getInt(K_DIGITS, 10));
                  lang = prefs.getInt(K_LANG, 0) == 1 ? 1 : 0;
                  page = lang == 1 ? PAGE_EN : PAGE_AR;
              }

              @Override
              public View onCreateInputView() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(C_BG);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);
                  root.setPadding(dp(3), dp(2), dp(3), dp(4));

                  status = new TextView(this);
                  status.setGravity(Gravity.CENTER);
                  status.setTextColor(C_DIM);
                  status.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                  status.setIncludeFontPadding(false);
                  root.addView(status, new LinearLayout.LayoutParams(MATCH, dp(22)));

                  content = new FrameLayout(this);
                  root.addView(content, new LinearLayout.LayoutParams(MATCH, dp(ROW_DP * 5)));

                  render();
                  return root;
              }

              @Override
              public void onStartInputView(EditorInfo info, boolean restarting) {
                  super.onStartInputView(info, restarting);
                  if (!restarting) {
                      typed = 0;
                      lastKind = 0;
                      panelOpen = false;
                      shift = 0;
                      if (info != null) {
                          int cls = info.inputType & InputType.TYPE_MASK_CLASS;
                          if (cls == InputType.TYPE_CLASS_NUMBER || cls == InputType.TYPE_CLASS_PHONE) {
                              page = PAGE_NUM;
                          }
                      }
                      render();
                  }
              }

              @Override
              public void onFinishInputView(boolean finishingInput) {
                  super.onFinishInputView(finishingInput);
                  stopRepeat();
                  handler.removeCallbacks(sendRunnable);
                  handler.removeCallbacks(pauseRunnable);
              }

              @Override
              public boolean onEvaluateFullscreenMode() {
                  return false;
              }

              // ------------------------------------------------------------ \u0627\u0644\u0631\u0633\u0645

              private void postRender() {
                  handler.post(renderRunnable);
              }

              private void render() {
                  if (content == null) return;
                  stopRepeat();
                  ViewGroup.LayoutParams clp = content.getLayoutParams();
                  if (clp != null) {
                      clp.height = dp(page == PAGE_NUM && !panelOpen ? ROW_DP * 5 + 60 : ROW_DP * 5);
                      content.setLayoutParams(clp);
                  }
                  content.removeAllViews();
                  View v = panelOpen ? buildPanel() : buildKeys();
                  content.addView(v, new FrameLayout.LayoutParams(MATCH, MATCH));
                  updateStatus();
              }

              private void updateStatus() {
                  if (status == null) return;
                  StringBuilder sb = new StringBuilder("KenzO board");
                  if (auto) {
                      sb.append("   \u2022   \u0623\u0631\u0642\u0627\u0645 ").append(lastKind == 1 ? typed : 0)
                              .append('/').append(digits).append("  ").append(unitName(digits));
                  }
                  if (autoLetters) {
                      sb.append("   \u2022   \u062d\u0631\u0648\u0641 ").append(lastKind == 2 ? typed : 0)
                              .append('/').append(letters);
                  }
                  if (split) sb.append("   \u2022   \u062a\u0641\u0643\u064a\u0643");
                  status.setText(sb.toString());
              }

              // ------------------------------------------------------------ \u0644\u0648\u062d\u0629 \u0627\u0644\u0623\u0632\u0631\u0627\u0631

              private static String[] row(String s) {
                  return s.split(" ");
              }

              private boolean flatPage() {
                  return page == PAGE_AR || page == PAGE_AR2 || page == PAGE_EN;
              }

              private boolean hasToolbar() {
                  return true;
              }

              private String[] toolbarRow() {
                  if (page == PAGE_NUM) return new String[]{"@N9", "@N10", "@N11", "@N12", "@N13"};
                  if (page == PAGE_SYM) return new String[]{"@PANEL", "@LANG"};
                  return new String[]{"@PANEL", "@LANG", "@SHIFT", "@W3", "@W4", "@W5", "@W6", "@W7"};
              }

              private String[][] rowsFor() {
                  switch (page) {
                      case PAGE_AR2:
                          return new String[][]{
                                  row("\u0623 \u0625 \u0622 \u0621 \u0624 \u0626 \u067e \u0686 \u06a4 \u06af \u0698"),
                                  row("\u064e \u064f \u0650 \u064b \u064c \u064d \u0651 \u0652 \u0640 \u060c \u061b"),
                                  row("\u0644\u0627 \u061f ! , : \" ' ( ) - @DEL")
                          };
                      case PAGE_EN:
                          return new String[][]{
                                  up(row("q w e r t y u i o p")),
                                  up(new String[]{"", "a", "s", "d", "f", "g", "h", "j", "k", "l", ""}),
                                  up(new String[]{"", "", "z", "x", "c", "v", "b", "n", "m", "@DEL"})
                          };
                      case PAGE_NUM:
                          return new String[][]{
                                  {"1", "2", "3", "."},
                                  {"4", "5", "6", ","},
                                  {"7", "8", "9", "-"},
                                  {"@PANEL", "0", "@DEL", "@SYM"}
                          };
                      case PAGE_SYM:
                          return new String[][]{
                                  row("! @ # $ % ^ & * ( )"),
                                  row("- _ = + / \\ | ~ ' \""),
                                  row(": ; , . ? < > \u00ab \u00bb @DEL")
                          };
                      case PAGE_AR:
                      default:
                          return new String[][]{
                                  row("\u0636 \u0635 \u062b \u0642 \u0641 \u063a \u0639 \u0647 \u062e \u062d \u062c"),
                                  row("\u0634 \u0633 \u064a \u0628 \u0644 \u0627 \u062a \u0646 \u0645 \u0643 \u0637"),
                                  row("\u0630 \u0621 \u0624 \u0631 \u0649 \u0629 \u0648 \u0632 \u0638 \u062f @DEL")
                          };
                  }
              }

              private String[] up(String[] in) {
                  if (shift == 0) return in;
                  String[] out = new String[in.length];
                  for (int i = 0; i < in.length; i++) {
                      out[i] = isSpecial(in[i]) ? in[i] : in[i].toUpperCase();
                  }
                  return out;
              }

              private String[] bottomRow() {
                  String comma = lang == 0 ? "\u060c" : ",";
                  boolean alt = page == PAGE_NUM || page == PAGE_SYM;
                  if (page == PAGE_NUM) return new String[]{"@ABC", "@ENTER"};
                  return new String[]{alt ? "@ABC" : "@NUM", comma, "@SPACE", ".", "@ENTER"};
              }

              private View buildKeys() {
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  if (hasToolbar()) {
                      col.addView(buildRow(toolbarRow(), true), new LinearLayout.LayoutParams(MATCH, 0, 0.8f));
                  }
                  String[][] rows = rowsFor();
                  for (String[] r : rows) {
                      col.addView(buildRow(r, false), new LinearLayout.LayoutParams(MATCH, 0, 1f));
                  }
                  col.addView(buildRow(bottomRow(), false),
                          new LinearLayout.LayoutParams(MATCH, 0, page == PAGE_NUM ? 1.5f : 1f));
                  return col;
              }

              private LinearLayout buildRow(String[] specs, boolean toolbar) {
                  LinearLayout line = new LinearLayout(this);
                  line.setOrientation(LinearLayout.HORIZONTAL);
                  line.setMotionEventSplittingEnabled(true);
                  for (String spec : specs) {
                      if (spec.length() == 0) {
                          line.addView(new View(this), new LinearLayout.LayoutParams(0, MATCH, 0.5f));
                          continue;
                      }
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, MATCH, weightOf(spec));
                      lp.setMargins(dp(1), dp(1), dp(1), dp(1));
                      line.addView(makeKey(spec, toolbar), lp);
                  }
                  return line;
              }

              private static boolean isChip(String spec) {
                  return spec.matches("@[NW][0-9]+");
              }

              private boolean chipOn(String spec) {
                  int n = Integer.parseInt(spec.substring(2));
                  if (spec.charAt(1) == 'N') return auto && digits == n;
                  return autoLetters && letters == n;
              }

              private void chipTap(String spec) {
                  int n = Integer.parseInt(spec.substring(2));
                  if (spec.charAt(1) == 'N') {
                      if (auto && digits == n) {
                          auto = false;
                      } else {
                          auto = true;
                          setDigits(n);
                      }
                      prefs.edit().putBoolean(K_AUTO, auto).apply();
                  } else {
                      if (autoLetters && letters == n) {
                          autoLetters = false;
                      } else {
                          autoLetters = true;
                          setLetters(n);
                      }
                      prefs.edit().putBoolean(K_AUTOL, autoLetters).apply();
                  }
                  typed = 0;
                  lastKind = 0;
                  postRender();
              }

              private static boolean isSpecial(String spec) {
                  return spec.length() > 1 && spec.charAt(0) == '@';
              }

              private float weightOf(String spec) {
                  if (!isSpecial(spec)) return 1f;
                  switch (spec) {
                      case "@DEL":
                          return page == PAGE_EN ? 2f : 1f;
                      case "@SPACE":
                          return 5f;
                      case "@ENTER":
                          return page == PAGE_NUM ? 5f : 1.6f;
                      case "@NUM":
                      case "@ABC":
                          return 1.3f;
                      default:
                          return 1f;
                  }
              }

              private String labelOf(String spec) {
                  if (!isSpecial(spec)) {
                      if (spec.length() == 1 && Character.getType(spec.charAt(0)) == Character.NON_SPACING_MARK) {
                          return "\u0640" + spec;
                      }
                      return spec;
                  }
                  if (isChip(spec)) return spec.substring(2);
                  switch (spec) {
                      case "@DEL":
                          return "\u232b";
                      case "@SHIFT":
                          if (lang == 1) return "\u21e7";
                          return page == PAGE_AR2 ? "\u0623\u0628" : "\u0623 \u067e";
                      case "@SPACE":
                          return lang == 0 ? "\u0627\u0644\u0639\u0631\u0628\u064a\u0629" : "English";
                      case "@ENTER":
                          return page == PAGE_NUM ? "\u0625\u0631\u0633\u0627\u0644  \u21b5" : "\u21b5";
                      case "@PANEL":
                          return "\u2699";
                      case "@NUM":
                          return "123";
                      case "@ABC":
                          return lang == 0 ? "\u0623\u0628" : "ABC";
                      case "@LANG":
                          return lang == 0 ? "EN" : "\u0639";
                      case "@SYM":
                          return "#+=";
                      default:
                          return spec;
                  }
              }

              private GradientDrawable rounded(int color) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(6));
                  return g;
              }

              private Drawable makeBg(int color, boolean underline) {
                  GradientDrawable g = rounded(color);
                  if (underline && Build.VERSION.SDK_INT >= 23) {
                      GradientDrawable line = new GradientDrawable();
                      line.setColor(C_LINE);
                      LayerDrawable ld = new LayerDrawable(new Drawable[]{g, line});
                      ld.setLayerGravity(1, Gravity.BOTTOM);
                      ld.setLayerHeight(1, dp(2));
                      ld.setLayerInset(1, dp(3), 0, dp(3), 0);
                      return ld;
                  }
                  return g;
              }

              private TextView makeKey(final String spec, boolean toolbar) {
                  TextView tv = new TextView(this);
                  tv.setText(labelOf(spec));
                  tv.setGravity(Gravity.CENTER);
                  tv.setTextColor(C_TEXT);
                  tv.setIncludeFontPadding(false);
                  boolean special = isSpecial(spec);
                  boolean flat = flatPage() || toolbar;
                  float size;
                  if (toolbar) {
                      size = 20;
                  } else if (special) {
                      size = spec.equals("@PANEL") ? 22 : 17;
                  } else if (page == PAGE_NUM) {
                      size = 26;
                  } else if (page == PAGE_SYM) {
                      size = 22;
                  } else {
                      size = page == PAGE_EN ? 26 : 28;
                  }
                  int base = flat ? C_BG : (special ? C_SPECIAL : C_KEY);
                  if (spec.equals("@SPACE")) {
                      size = 13;
                      tv.setTextColor(C_DIM);
                  }
                  if (spec.equals("@SHIFT")) {
                      boolean active = (page == PAGE_EN && shift > 0) || page == PAGE_AR2;
                      if (active) base = C_ON;
                  }
                  if (isChip(spec)) {
                      size = 16;
                      base = chipOn(spec) ? C_ON : C_SPECIAL;
                      flat = false;
                  }
                  tv.setTextSize(TypedValue.COMPLEX_UNIT_SP, size);

                  boolean underline = flatPage() && !special && !toolbar;
                  final Drawable normal = makeBg(base, underline);
                  final Drawable pressed = makeBg(C_PRESSED, underline);
                  tv.setBackground(normal);
                  tv.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  v.setBackground(pressed);
                                  onKey(spec, v);
                                  return true;
                              case MotionEvent.ACTION_UP:
                              case MotionEvent.ACTION_CANCEL:
                                  v.setBackground(normal);
                                  if (spec.equals("@DEL")) stopRepeat();
                                  return true;
                              default:
                                  return true;
                          }
                      }
                  });
                  return tv;
              }

              // ------------------------------------------------------------ \u0627\u0644\u0636\u063a\u0637 \u0639\u0644\u0649 \u0627\u0644\u0623\u0632\u0631\u0627\u0631

              private void onKey(String spec, View v) {
                  if (haptic) v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP);
                  if (!isSpecial(spec)) {
                      typeText(spec);
                      return;
                  }
                  if (isChip(spec)) {
                      chipTap(spec);
                      return;
                  }
                  switch (spec) {
                      case "@DEL":
                          deleteBack();
                          handler.removeCallbacks(repeatRunnable);
                          handler.postDelayed(repeatRunnable, 380);
                          break;
                      case "@SPACE":
                          commit(" ");
                          handler.removeCallbacks(pauseRunnable);
                          typed = 0;
                          lastKind = 0;
                          updateStatus();
                          break;
                      case "@ENTER":
                          handler.removeCallbacks(pauseRunnable);
                          typed = 0;
                          lastKind = 0;
                          sendNow();
                          updateStatus();
                          break;
                      case "@SHIFT":
                          if (page == PAGE_EN) {
                              long now = SystemClock.uptimeMillis();
                              if (shift == 2) {
                                  shift = 0;
                              } else if (shift == 1 && now - lastShiftTap < 350) {
                                  shift = 2;
                              } else {
                                  shift = (shift == 0) ? 1 : 0;
                              }
                              lastShiftTap = now;
                          } else {
                              page = (page == PAGE_AR) ? PAGE_AR2 : PAGE_AR;
                          }
                          postRender();
                          break;
                      case "@NUM":
                          page = PAGE_NUM;
                          postRender();
                          break;
                      case "@SYM":
                          page = PAGE_SYM;
                          postRender();
                          break;
                      case "@ABC":
                          shift = 0;
                          page = lang == 1 ? PAGE_EN : PAGE_AR;
                          postRender();
                          break;
                      case "@LANG":
                          lang = 1 - lang;
                          prefs.edit().putInt(K_LANG, lang).apply();
                          shift = 0;
                          page = lang == 1 ? PAGE_EN : PAGE_AR;
                          postRender();
                          break;
                      case "@PANEL":
                          handler.removeCallbacks(pauseRunnable);
                          panelOpen = true;
                          postRender();
                          break;
                      default:
                          break;
                  }
              }

              private void commit(String s) {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic != null) ic.commitText(s, 1);
              }

              private void typeText(String s) {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;
                  char c = s.charAt(0);
                  if (s.length() == 1 && Character.getType(c) == Character.NON_SPACING_MARK) {
                      ic.commitText(s, 1);   // \u0627\u0644\u062d\u0631\u0643\u0627\u062a \u0645\u0627 \u062a\u0646\u062d\u0633\u0628
                      return;
                  }
                  boolean isDigit = s.length() == 1
                          && ((c >= '0' && c <= '9') || (c >= '\u0660' && c <= '\u0669'));
                  boolean isLetter = !isDigit && Character.isLetter(c);
                  int kind = isDigit ? 1 : (isLetter ? 2 : 0);

                  if (kind == 2 && split) {
                      ic.commitText(s + " ", 1);
                  } else {
                      ic.commitText(s, 1);
                  }

                  handler.removeCallbacks(pauseRunnable);
                  if (kind != lastKind) typed = 0;
                  lastKind = kind;
                  if (kind == 0) {
                      typed = 0;
                  } else {
                      typed++;
                      int limit = (kind == 1) ? digits : letters;
                      boolean on = (kind == 1) ? auto : autoLetters;
                      if (typed >= limit) {
                          typed = 0;
                          if (on) {
                              sendNow();
                          }
                      }
                  }
                  if (page == PAGE_EN && shift == 1) {
                      shift = 0;
                      postRender();
                  }
                  updateStatus();
              }

              private void deleteBack() {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;
                  handler.removeCallbacks(pauseRunnable);
                  boolean done = false;
                  if (split) {
                      CharSequence before = ic.getTextBeforeCursor(2, 0);
                      if (before != null && before.length() >= 2
                              && before.charAt(before.length() - 1) == ' '
                              && before.charAt(before.length() - 2) != ' ') {
                          ic.deleteSurroundingText(2, 0);
                          done = true;
                      }
                  }
                  if (!done) sendDownUpKeyEvents(KeyEvent.KEYCODE_DEL);
                  if (typed > 0) typed--;
                  updateStatus();
              }

              private void stopRepeat() {
                  handler.removeCallbacks(repeatRunnable);
              }

              private void sendNow() {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;
                  if (!sendDefaultEditorAction(true)) {
                      sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER);
                  }
              }

              // \u064a\u0641\u0643\u0643 \u0622\u062e\u0631 \u0643\u0644\u0645\u0629 \u0642\u0628\u0644 \u0627\u0644\u0645\u0624\u0634\u0631: \u0633\u0644\u0627\u0645 -> \u0633 \u0644 \u0627 \u0645
              private void splitLastWord() {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;
                  CharSequence cs = ic.getTextBeforeCursor(80, 0);
                  if (cs == null) return;
                  String s = cs.toString();
                  int end = s.length();
                  int e = end;
                  while (e > 0 && Character.isWhitespace(s.charAt(e - 1))) e--;
                  int st = e;
                  while (st > 0 && !Character.isWhitespace(s.charAt(st - 1))) st--;
                  if (e - st < 2) return;
                  String word = s.substring(st, e);
                  String trailing = s.substring(e);
                  StringBuilder sb = new StringBuilder();
                  int i = 0;
                  while (i < word.length()) {
                      int cp = word.codePointAt(i);
                      if (sb.length() > 0) sb.append(' ');
                      sb.appendCodePoint(cp);
                      i += Character.charCount(cp);
                  }
                  sb.append(trailing);
                  ic.deleteSurroundingText(end - st, 0);
                  ic.commitText(sb.toString(), 1);
              }

              // ------------------------------------------------------------ \u0644\u0648\u062d\u0629 \u0627\u0644\u0625\u0639\u062f\u0627\u062f\u0627\u062a (\u062f\u0627\u062e\u0644 \u0627\u0644\u0643\u064a\u0628\u0648\u0631\u062f)

              private int clampDigits(int d) {
                  if (d < 1) return 1;
                  if (d > MAX_DIGITS) return MAX_DIGITS;
                  return d;
              }

              private int clampPause(int d) {
                  if (d < 200) return 200;
                  if (d > 3000) return 3000;
                  return d;
              }

              private View.OnClickListener pauseStepper(final int delta) {
                  return new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          pauseMs = clampPause(pauseMs + delta);
                          prefs.edit().putInt(K_PAUSE, pauseMs).apply();
                          postRender();
                      }
                  };
              }

              private View.OnClickListener flip(final String key) {
                  return new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          switch (key) {
                              case K_AUTO:
                                  auto = !auto;
                                  prefs.edit().putBoolean(K_AUTO, auto).apply();
                                  break;
                              case K_AUTOL:
                                  autoLetters = !autoLetters;
                                  prefs.edit().putBoolean(K_AUTOL, autoLetters).apply();
                                  break;
                              case K_AUTOP:
                                  autoPause = !autoPause;
                                  prefs.edit().putBoolean(K_AUTOP, autoPause).apply();
                                  break;
                              case K_SPLIT:
                                  split = !split;
                                  prefs.edit().putBoolean(K_SPLIT, split).apply();
                                  break;
                              case K_HAPTIC:
                                  haptic = !haptic;
                                  prefs.edit().putBoolean(K_HAPTIC, haptic).apply();
                                  break;
                              default:
                                  break;
                          }
                          typed = 0;
                          lastKind = 0;
                          handler.removeCallbacks(pauseRunnable);
                          postRender();
                      }
                  };
              }

              private int clampLetters(int d) {
                  if (d < 1) return 1;
                  if (d > MAX_LETTERS) return MAX_LETTERS;
                  return d;
              }

              private void setLetters(int d) {
                  letters = clampLetters(d);
                  typed = 0;
                  prefs.edit().putInt(K_LETTERS, letters).apply();
              }

              private View.OnClickListener letterStepper(final int delta) {
                  return new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          setLetters(letters + delta);
                          postRender();
                      }
                  };
              }

              private void setDigits(int d) {
                  digits = clampDigits(d);
                  typed = 0;
                  prefs.edit().putInt(K_DIGITS, digits).apply();
              }

              private LinearLayout hrow() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.HORIZONTAL);
                  return l;
              }

              private LinearLayout.LayoutParams cellParams(int w, int h, float weight) {
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(w, h, weight);
                  lp.setMargins(dp(2), dp(2), dp(2), dp(2));
                  return lp;
              }

              private TextView cell(String text, int bg, float sp, View.OnClickListener l) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setGravity(Gravity.CENTER);
                  t.setTextColor(C_TEXT);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  t.setIncludeFontPadding(false);
                  t.setPadding(dp(4), 0, dp(4), 0);
                  t.setBackground(rounded(bg));
                  if (l != null) t.setOnClickListener(l);
                  return t;
              }

              private View.OnClickListener stepper(final int delta) {
                  return new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          setDigits(digits + delta);
                          postRender();
                      }
                  };
              }

              private View buildPanel() {
                  LinearLayout p = new LinearLayout(this);
                  p.setOrientation(LinearLayout.VERTICAL);
                  p.setPadding(dp(2), dp(2), dp(2), dp(2));

                  // \u0627\u0644\u0639\u0646\u0648\u0627\u0646 + \u0632\u0631 \u0627\u0644\u0631\u062c\u0648\u0639
                  LinearLayout head = hrow();
                  TextView title = new TextView(this);
                  title.setText("\u2699  KenzO board");
                  title.setTextColor(C_TEXT);
                  title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  title.setGravity(Gravity.CENTER_VERTICAL);
                  title.setPadding(dp(4), 0, 0, 0);
                  head.addView(title, new LinearLayout.LayoutParams(0, MATCH, 1f));
                  head.addView(cell("\u0631\u062c\u0648\u0639 \u2715", C_SPECIAL, 13, new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          panelOpen = false;
                          postRender();
                      }
                  }), cellParams(dp(90), MATCH, 0f));
                  p.addView(head, new LinearLayout.LayoutParams(MATCH, dp(30)));

                  // \u0627\u0644\u0623\u0632\u0631\u0627\u0631: \u0623\u062e\u0636\u0631 = \u0634\u063a\u0651\u0627\u0644 \u060c \u0631\u0645\u0627\u062f\u064a = \u0645\u0637\u0641\u064a
                  LinearLayout toggles = hrow();
                  toggles.addView(cell("\u0625\u0631\u0633\u0627\u0644\n\u0623\u0631\u0642\u0627\u0645", auto ? C_ON : C_SPECIAL, 10.5f, flip(K_AUTO)),
                          cellParams(0, MATCH, 1f));
                  toggles.addView(cell("\u0625\u0631\u0633\u0627\u0644\n\u062d\u0631\u0648\u0641", autoLetters ? C_ON : C_SPECIAL, 10.5f, flip(K_AUTOL)),
                          cellParams(0, MATCH, 1f));
                  toggles.addView(cell("\u062a\u0641\u0643\u064a\u0643", split ? C_ON : C_SPECIAL, 10.5f, flip(K_SPLIT)),
                          cellParams(0, MATCH, 1f));
                  toggles.addView(cell("\u0627\u0647\u062a\u0632\u0627\u0632", haptic ? C_ON : C_SPECIAL, 10.5f, flip(K_HAPTIC)),
                          cellParams(0, MATCH, 1f));
                  toggles.addView(cell("\u0641\u0643\u0651\u0643\n\u0622\u062e\u0631", C_SPECIAL, 10.5f, new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          splitLastWord();
                          panelOpen = false;
                          postRender();
                      }
                  }), cellParams(0, MATCH, 1f));
                  p.addView(toggles, new LinearLayout.LayoutParams(MATCH, dp(42)));

                  // \u0639\u062f\u062f \u0627\u0644\u062d\u0631\u0648\u0641 + \u0645\u062f\u0629 \u0627\u0644\u062a\u0648\u0642\u0641
                  LinearLayout opts = hrow();
                  opts.addView(cell("-", C_SPECIAL, 16, letterStepper(-1)), cellParams(dp(30), MATCH, 0f));
                  opts.addView(cell(letters + " \u062d\u0631\u0641", C_KEY, 12, null), cellParams(0, MATCH, 1f));
                  opts.addView(cell("+", C_SPECIAL, 16, letterStepper(1)), cellParams(dp(30), MATCH, 0f));
                  p.addView(opts, new LinearLayout.LayoutParams(MATCH, dp(34)));

                  // \u0639\u062f\u062f \u0627\u0644\u062e\u0627\u0646\u0627\u062a
                  LinearLayout step = hrow();
                  step.addView(cell("-10", C_SPECIAL, 15, stepper(-10)), cellParams(0, MATCH, 1f));
                  step.addView(cell("-1", C_SPECIAL, 15, stepper(-1)), cellParams(0, MATCH, 1f));
                  TextView val = cell(digits + " \u062e\u0627\u0646\u0629  \u2022  " + unitName(digits), C_KEY, 14, null);
                  step.addView(val, cellParams(0, MATCH, 3f));
                  step.addView(cell("+1", C_SPECIAL, 15, stepper(1)), cellParams(0, MATCH, 1f));
                  step.addView(cell("+10", C_SPECIAL, 15, stepper(10)), cellParams(0, MATCH, 1f));
                  p.addView(step, new LinearLayout.LayoutParams(MATCH, dp(38)));

                  // \u0627\u0644\u0645\u0631\u0627\u062a\u0628: \u0632\u0631 \u0644\u0643\u0644 \u0639\u062f\u062f \u062e\u0627\u0646\u0627\u062a \u0645\u0646 1 \u0625\u0644\u0649 101
                  final ScrollView sv = new ScrollView(this);
                  LinearLayout list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  for (int n = 1; n <= MAX_DIGITS; n += 2) {
                      LinearLayout r = hrow();
                      r.addView(magCell(n), cellParams(0, MATCH, 1f));
                      if (n + 1 <= MAX_DIGITS) {
                          r.addView(magCell(n + 1), cellParams(0, MATCH, 1f));
                      } else {
                          r.addView(new View(this), cellParams(0, MATCH, 1f));
                      }
                      list.addView(r, new LinearLayout.LayoutParams(MATCH, dp(GRID_ROW_DP)));
                  }
                  sv.addView(list, new ViewGroup.LayoutParams(MATCH, ViewGroup.LayoutParams.WRAP_CONTENT));
                  p.addView(sv, new LinearLayout.LayoutParams(MATCH, 0, 1f));

                  final int target = Math.max(0, ((digits - 1) / 2) * dp(GRID_ROW_DP) - dp(GRID_ROW_DP));
                  sv.post(new Runnable() {
                      @Override
                      public void run() {
                          sv.scrollTo(0, target);
                      }
                  });
                  return p;
              }

              private TextView magCell(final int n) {
                  String label = unitName(n) + " \u2022 " + n + " \u062e\u0627\u0646\u0629";
                  TextView t = cell(label, n == digits ? C_ON : C_SPECIAL, 13, new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          setDigits(n);
                          panelOpen = false;
                          page = PAGE_NUM;
                          postRender();
                      }
                  });
                  t.setMaxLines(1);
                  if (Build.VERSION.SDK_INT >= 26) {
                      t.setAutoSizeTextTypeUniformWithConfiguration(8, 13, 1, TypedValue.COMPLEX_UNIT_SP);
                  }
                  return t;
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }
          }
